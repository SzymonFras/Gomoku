# Learning Loop
main_rl_loop:
  iterations: 2
  num_games: 80
  target_moves: 50000
  window_size: 2
  only_winners: False
  skip_first_gen: False
  warmup_ratios: [0.0]

# Evaluate candidate
evaluate_candidate:
  baseline_model_path: 'models/model_21_rl.pt'
  num_games_old: 40
  num_games_heur: 40
  num_games_base: 20
  threshold_old: 52.0
  threshold_base: 0.0
  threshold_heur: 0.0
  num_simulations: 300
  c_puct: 1
  opening_moves_k: 2

# Game generate
generator:
  num_simulations: 300
  temp_moves: 10
  c_puct: 1
  temp: 0.5
  opening_moves_k: 2
  heuristic_ratio: 0.1

# CNN
CNN:
  batch_size: 512
  epochs: 5
  lr: 0.0001
  weight_decay: 0.0001

# GUI
gui:
  path: 'models/model_22_rl.pt'
  structure: alphazero_structure
  num_simulations: 1000
  c_puct: 1.5
  human_starts: False
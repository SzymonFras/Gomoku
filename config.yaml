# Learning Loop
main_rl_loop:
  iterations: 4
  num_games: 125
  target_moves: 100000
  window_size: 4
  only_winners: False
  skip_first_gen: False
  warmup_ratios: [0.0]
  consecutive_failures: 0

# Evaluate candidate
evaluate_candidate:
  baseline_model_path: 'models/model_21_rl.pt'
  num_games_old: 40
  num_games_heur: 40
  num_games_base: 20
  threshold_old: 52.0
  threshold_base: 70.0
  threshold_heur: 70.0
  num_simulations: 300
  c_puct: 3.0
  opening_moves_k: 2

# Game generate
generator:
  num_simulations: 300
  temp_moves: 4
  c_puct: 3.0
  temp: 0.5
  opening_moves_k: 2
  heuristic_ratio: 0.2
  gamma: 1.0

# CNN
CNN:
  batch_size: 1024
  epochs: 4
  lr: 0.00005
  weight_decay: 0.0001

# GUI
gui:
  path: 'models/model_27_rl.pt'
  structure: alphazero_structure
  num_simulations: 1000
  c_puct: 2.0
  human_starts: False
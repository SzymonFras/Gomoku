# Learning Loop
main_rl_loop:
  iterations: 3
  num_games: 100
  target_moves: 80000
  window_size: 4
  only_winners: False
  skip_first_gen: True
  warmup_ratios: [1.0, 0.4, 0.2, 0.0]

#Evaluate candidate
evaluate_candidate:
  baseline_model_path: 'models/model_20_rl.pt'
  num_games_old: 40
  num_games_heur: 20
  num_games_base: 40
  threshold_old: 52.0
  threshold_base: 60
  threshold_heur: 20
  num_simulations: 100
  c_puct: 1.5
  opening_moves_k: 2

# Game generate
generator:
  num_simulations: 100 #mcts
  temp_moves: 14
  c_puct: 2.5
  temp: 0.5
  opening_moves_k: 2

# Cnn
CNN:
  batch_size: 512
  epochs: 2
  lr: 0.00002

#GUI
gui:
  path: 'models/model_20_rl.pt'
  structure: alphazero_structure
  num_simulations: 1000
  c_puct: 1.5
  human_starts: False